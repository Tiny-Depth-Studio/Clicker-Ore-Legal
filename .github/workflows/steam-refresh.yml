name: Refresh Steam data

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "guide/**"
      - ".github/workflows/steam-refresh.yml"

permissions:
  contents: write

concurrency:
  group: steam-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch store data and announcements
        run: python site/steam.py

      - name: Rebuild the landing page
        run: python site/build_site.py

      - name: Rebuild the player guides
        run: python guide/build.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "Steam data unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html site/data/steam.json player_guide_*.html
          git commit -m "Refresh Steam news and store art on the landing page"
          git push
